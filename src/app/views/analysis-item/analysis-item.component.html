@if (analysis) {
  <div class="analysis-wrapper">
    <div class="analysis-header">
      <div>{{ analysis.name }}</div>
      <button class="analysis-deleteBtn" (click)="deleteAnalyse()">
        <svg width="13" height="14" viewBox="0 0 13 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M9.96997 3.02186L9.44884 10.8384C9.40323 11.523 9.38039 11.8653 9.23256 12.1248C9.10236 12.3534 8.90598 12.5371 8.66933 12.6518C8.40053 12.782 8.05743 12.782 7.37129 12.782H4.76049C4.07435 12.782 3.73128 12.782 3.46246 12.6518C3.2258 12.5371 3.02944 12.3534 2.89926 12.1248C2.75139 11.8653 2.72857 11.523 2.68293 10.8384L2.16183 3.02186M0.860474 3.02186H11.2713M8.66861 3.02186L8.49254 2.49355C8.32187 1.98159 8.2365 1.7256 8.07825 1.53635C7.93849 1.36922 7.75903 1.23986 7.55628 1.16013C7.32665 1.06982 7.05688 1.06982 6.51721 1.06982H5.61459C5.07492 1.06982 4.80515 1.06982 4.57553 1.16013C4.37278 1.23986 4.1933 1.36922 4.05354 1.53635C3.89527 1.7256 3.80995 1.98159 3.63929 2.49355L3.46319 3.02186"
            stroke="#ED7474" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="analysis-body">
      <section>
        <div style="font-weight: 700; font-size: 36px">{{ analysis.colonies_number }}</div>
        <div>Колоний обнаружено</div>
      </section>
      <section>
        <div>
          Подозрительные колонии
        </div>
        <b>
          {{ analysis.suspicious_colonies_number }}
        </b>
      </section>
      <section>
        <div>
          Распредение по типам
        </div>
        <b>
          @for (prClass of getPredictedClasses(); track prClass) {
            {{ prClass }}
            <br/>
          }</b>
      </section>
      <button class="btn btn-primary pdf" (click)="getPdf()">PDF</button>
    </div>
  </div>
} @else {
  Исследование не найдено
}
