<div class="pagination">
  <div class="pagination-info">
    <span>Показано </span>
    <span>{{ meta.currentCount }}</span>
    <span> из </span>
    <span>{{ meta.totalCount }}</span>
  </div>
  <div class="pagination-page">
    <button type="button" class="btn-changePage" (click)="changePage(false)" [disabled]="meta.currentPage <= 1">
      <svg width="11" height="8" viewBox="0 0 11 8" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M0.646446 3.64645C0.451184 3.84171 0.451184 4.15829 0.646446 4.35355L3.82843 7.53553C4.02369 7.7308 4.34027 7.7308 4.53553 7.53553C4.7308 7.34027 4.7308 7.02369 4.53553 6.82843L1.70711 4L4.53553 1.17157C4.7308 0.976311 4.7308 0.659729 4.53553 0.464467C4.34027 0.269204 4.02369 0.269205 3.82843 0.464467L0.646446 3.64645ZM11 3.5L1 3.5L1 4.5L11 4.5L11 3.5Z"
          fill="#323231"/>
      </svg>
    </button>
    <div>
      {{ meta.currentPage }}
    </div>
    <button type="button" class="btn-changePage" (click)="changePage(true)"
            [disabled]="meta.currentPage*meta.perPage >= (meta.totalCount || 0)">
      <svg width="11" height="8" viewBox="0 0 11 8" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M10.3536 4.35355C10.5488 4.15829 10.5488 3.84171 10.3536 3.64645L7.17157 0.464466C6.97631 0.269204 6.65973 0.269204 6.46447 0.464466C6.2692 0.659728 6.2692 0.976311 6.46447 1.17157L9.29289 4L6.46447 6.82843C6.2692 7.02369 6.2692 7.34027 6.46447 7.53553C6.65973 7.7308 6.97631 7.7308 7.17157 7.53553L10.3536 4.35355ZM0 4.5H10V3.5H0V4.5Z"
          fill="#323231"/>
      </svg>
    </button>
  </div>
</div>
